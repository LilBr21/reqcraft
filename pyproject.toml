[project]
name = "reqcraft"
version = "0.1.0"
description = "A terminal-first HTTP client and test runner for API collections"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LilBr21", email = "halina.syposz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.0", "pydantic>=2.0", "pyyaml>=6.0", "jinja2>=3.1", "jmespath>=1.0", "python-dotenv>=1.0", ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/LilBr21/reqcraft"
Repository = "https://github.com/LilBr21/reqcraft"
Issues = "https://github.com/LilBr21/reqcraft/issues"

[project.scripts]
reqcraft = "reqcraft.cli.app:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]